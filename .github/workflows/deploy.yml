name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN에 Pages 배포 권한을 준다. id-token은 deploy-pages가
# OIDC로 배포 대상을 검증할 때 필요하다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 된다. 진행 중인 배포를 취소하지 않고 줄을 세운다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 로컬 시스템 Node는 16이지만 Next 16은 20 이상을 요구한다.
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          # next.config.ts의 output: "export" 산출물
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
